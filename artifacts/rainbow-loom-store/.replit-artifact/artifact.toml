kind = "web"
previewPath = "/"
title = "The Rainbow Loom Vibe Store"
version = "1.0.0"
id = "artifacts/rainbow-loom-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23072

[services.development]
run = "pnpm --filter @workspace/rainbow-loom-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rainbow-loom-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/rainbow-loom-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23072"
BASE_PATH = "/"
