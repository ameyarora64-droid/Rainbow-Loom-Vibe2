openapi: "3.1.0"
info:
  title: Api
  version: "0.1.0"
  description: Rainbow Loom Vibe Store API
paths:
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Admin - get all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders/{orderId}/hold:
    post:
      operationId: holdOrder
      tags: [orders]
      summary: Admin - put an order on hold and email customer
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order put on hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders/{orderId}/unhold:
    post:
      operationId: unholdOrder
      tags: [orders]
      summary: Admin - remove hold and email customer their order is back in progress
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order unholded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders/{orderId}/start:
    post:
      operationId: startOrder
      tags: [orders]
      summary: Admin - start making an order with time estimate, email customer
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOrderBody"
      responses:
        "200":
          description: Order started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders/{orderId}/complete:
    post:
      operationId: completeOrder
      tags: [orders]
      summary: Admin - mark an order as complete
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [orders]
      summary: Admin login with passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Wrong passcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Get all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{productId}/colors:
    patch:
      operationId: updateProductColors
      tags: [products]
      summary: Admin - update available colors for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductColorsBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /products/{productId}/available:
    patch:
      operationId: updateProductAvailable
      tags: [products]
      summary: Admin - toggle product available/unavailable
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductAvailableBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /store/status:
    get:
      operationId: getStoreStatus
      tags: [store]
      summary: Get whether the store is open or closed
      responses:
        "200":
          description: Store status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
    patch:
      operationId: updateStoreStatus
      tags: [store]
      summary: Admin - open or close the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreStatus"
      responses:
        "200":
          description: Store status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"

  /colors/global:
    patch:
      operationId: updateGlobalColor
      tags: [products]
      summary: Admin - enable/disable a color across all products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGlobalColorBody"
      responses:
        "200":
          description: Color updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
        status:
          type: string
        estimatedCompletion:
          type: string
        createdAt:
          type: string
      required:
        - id
        - orderNumber
        - customerName
        - customerEmail
        - items
        - total
        - status
        - createdAt

    CartItem:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        colors:
          type: array
          items:
            type: string
        pattern:
          $ref: "#/components/schemas/CartItemPattern"
        price:
          type: number
        petType:
          type: string
          enum:
            - dog
            - cat
      required:
        - productId
        - productName
        - colors
        - pattern
        - price

    CartItemPattern:
      type: string
      enum:
        - regular
        - dragon_scale
        - fish_scale
        - double_fish_scale

    OrderInput:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
      required:
        - customerName
        - customerEmail
        - items

    ErrorResult:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StartOrderBody:
      type: object
      properties:
        days:
          type: integer
        hours:
          type: integer
        minutes:
          type: integer
      required:
        - days
        - hours
        - minutes

    AdminCredentials:
      type: object
      properties:
        passcode:
          type: string
      required:
        - passcode

    AdminToken:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
      required:
        - success
        - token

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        available:
          type: boolean
        colors:
          type: array
          items:
            type: object
            properties:
              color:
                type: string
              available:
                type: boolean
      required:
        - id
        - name
        - price
        - available
        - colors

    UpdateProductColorsBody:
      type: object
      properties:
        colors:
          type: array
          items:
            type: object
            properties:
              color:
                type: string
              available:
                type: boolean
      required:
        - colors

    UpdateProductAvailableBody:
      type: object
      properties:
        available:
          type: boolean
      required:
        - available

    StoreStatus:
      type: object
      properties:
        open:
          type: boolean
      required:
        - open

    UpdateGlobalColorBody:
      type: object
      properties:
        color:
          type: string
        available:
          type: boolean
      required:
        - color
        - available
